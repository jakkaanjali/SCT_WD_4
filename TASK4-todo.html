<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — SkillCraft Technology</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    /* ============================================================
       DESIGN DIRECTION: Editorial / Warm Minimal
       Warm off-whites, ink-black type, amber accents.
       Feels like a premium paper planner gone digital.
       ============================================================ */

    /* ── CSS Variables ─────────────────────────────────────── */
    :root {
      --bg:           #f5f1eb;
      --bg2:          #ede8e0;
      --surface:      #ffffff;
      --surface2:     #f9f6f1;
      --border:       #e0d9cf;
      --border2:      #cdc4b7;
      --ink:          #1a1612;
      --ink2:         #4a4238;
      --ink3:         #8a7f72;
      --amber:        #d97b1e;
      --amber-light:  #fdf0e0;
      --amber-border: #f0c884;
      --green:        #2e7d52;
      --green-light:  #e8f5ee;
      --red:          #c0392b;
      --red-light:    #fdecea;
      --blue:         #1a5276;
      --blue-light:   #e8f0f8;
      --shadow-sm:    0 1px 3px rgba(26,22,18,.06);
      --shadow:       0 4px 16px rgba(26,22,18,.08);
      --shadow-lg:    0 8px 32px rgba(26,22,18,.12);
      --radius:       12px;
      --radius-lg:    18px;
      --t:            0.22s cubic-bezier(.4,0,.2,1);
      /* priority */
      --p-low:        #2e7d52;
      --p-low-bg:     #e8f5ee;
      --p-med:        #b45309;
      --p-med-bg:     #fef3c7;
      --p-high:       #c0392b;
      --p-high-bg:    #fdecea;
    }
    body.dark {
      --bg:           #141210;
      --bg2:          #1c1916;
      --surface:      #201d1a;
      --surface2:     #272320;
      --border:       #332e28;
      --border2:      #4a4238;
      --ink:          #f0ebe3;
      --ink2:         #c8bfb0;
      --ink3:         #7a6e62;
      --amber-light:  #2a1f0a;
      --amber-border: #7a5010;
      --green-light:  #0a1f12;
      --red-light:    #1f0a08;
      --blue-light:   #091525;
      --shadow-sm:    0 1px 3px rgba(0,0,0,.2);
      --shadow:       0 4px 16px rgba(0,0,0,.3);
      --shadow-lg:    0 8px 32px rgba(0,0,0,.4);
      --p-low-bg:     #0a1f12;
      --p-med-bg:     #1f1507;
      --p-high-bg:    #1f0a08;
    }

    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      transition: background var(--t), color var(--t);
    }
    input, button, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }
    button { cursor: pointer; }

    /* ── Decorative grain overlay ───────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: .5;
    }

    /* ── Page Layout ────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 32px;
      gap: 16px;
    }
    .header-left {}
    .brand {
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--ink3);
      margin-bottom: 4px;
    }
    .app-title {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1;
      color: var(--ink);
    }
    .app-title em {
      font-style: italic;
      color: var(--amber);
    }
    .header-meta {
      margin-top: 6px;
      font-size: .8rem;
      color: var(--ink3);
    }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink2);
      display: grid; place-items: center;
      font-size: 1.1rem;
      transition: all var(--t);
      box-shadow: var(--shadow-sm);
    }
    .icon-btn:hover {
      border-color: var(--amber);
      color: var(--amber);
      box-shadow: var(--shadow);
    }

    /* ── Stats Bar ─────────────────────────────────────────── */
    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: .78rem;
      font-weight: 500;
      color: var(--ink2);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }
    .stat-chip .num {
      font-family: 'Instrument Serif', serif;
      font-size: 1.1rem;
      color: var(--ink);
      line-height: 1;
    }
    .stat-chip.overdue .num { color: var(--red); }
    .stat-chip.done .num { color: var(--green); }

    /* ── Add Task Form ──────────────────────────────────────── */
    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 28px;
      box-shadow: var(--shadow);
      transition: box-shadow var(--t), border-color var(--t);
    }
    .add-form:focus-within {
      border-color: var(--amber-border);
      box-shadow: var(--shadow), 0 0 0 3px var(--amber-light);
    }

    .form-row1 {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .task-input {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: .95rem;
      color: var(--ink);
      outline: none;
      transition: border-color var(--t), background var(--t);
    }
    .task-input:focus { border-color: var(--amber-border); background: var(--surface2); }
    .task-input::placeholder { color: var(--ink3); }

    .add-btn {
      background: var(--amber);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 22px;
      font-size: .9rem;
      font-weight: 600;
      letter-spacing: .03em;
      transition: all var(--t);
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(217,123,30,.3);
    }
    .add-btn:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(217,123,30,.35); }
    .add-btn:active { transform: translateY(0); }
    .add-btn:disabled { opacity: .45; transform: none; cursor: not-allowed; }

    .form-row2 {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .form-row2 select,
    .form-row2 input[type="datetime-local"] {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: .82rem;
      color: var(--ink2);
      outline: none;
      transition: border-color var(--t), background var(--t);
      cursor: pointer;
    }
    .form-row2 select:focus,
    .form-row2 input[type="datetime-local"]:focus {
      border-color: var(--amber-border);
      background: var(--surface2);
    }

    /* ── Filter + Sort bar ─────────────────────────────────── */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
      box-shadow: var(--shadow-sm);
    }
    .filter-btn {
      background: transparent;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: .8rem;
      font-weight: 500;
      color: var(--ink3);
      transition: all var(--t);
    }
    .filter-btn.active {
      background: var(--amber);
      color: #fff;
    }
    .filter-btn:not(.active):hover { color: var(--ink); background: var(--bg2); }
    .toolbar-right { margin-left: auto; }
    .sort-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: .8rem;
      color: var(--ink2);
      outline: none;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color var(--t);
    }
    .sort-select:focus { border-color: var(--amber-border); }

    /* ── Task List ─────────────────────────────────────────── */
    .section-label {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink3);
      margin-bottom: 10px;
      margin-top: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .task-list { display: flex; flex-direction: column; gap: 8px; }

    /* ── Task Card ─────────────────────────────────────────── */
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: all var(--t);
      animation: slide-in .3s cubic-bezier(.34,1.56,.64,1) both;
      position: relative;
      cursor: grab;
    }
    .task-card:active { cursor: grabbing; }
    .task-card:hover { box-shadow: var(--shadow); border-color: var(--border2); }
    .task-card.dragging {
      opacity: .55;
      box-shadow: var(--shadow-lg);
      transform: scale(1.02) rotate(.5deg);
      z-index: 50;
    }
    .task-card.drag-over {
      border-color: var(--amber);
      box-shadow: 0 0 0 2px var(--amber-light);
    }

    /* Priority stripe */
    .task-card::before {
      content: '';
      position: absolute;
      left: 0; top: 12px; bottom: 12px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      transition: background var(--t);
    }
    .task-card.p-low::before    { background: var(--p-low); }
    .task-card.p-medium::before { background: var(--p-med); }
    .task-card.p-high::before   { background: var(--p-high); }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-12px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes slide-out {
      from { opacity: 1; transform: none; max-height: 100px; }
      to   { opacity: 0; transform: translateX(30px); max-height: 0; padding: 0; margin: 0; }
    }
    .task-card.removing {
      animation: slide-out .28s ease forwards;
      pointer-events: none;
      overflow: hidden;
    }

    /* Checkbox */
    .task-check {
      appearance: none;
      width: 20px; height: 20px;
      min-width: 20px;
      border: 2px solid var(--border2);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      transition: all var(--t);
      margin-top: 1px;
    }
    .task-check:checked {
      background: var(--green);
      border-color: var(--green);
    }
    .task-check:checked::after {
      content: '✓';
      position: absolute;
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .task-check:hover:not(:checked) { border-color: var(--amber); }

    /* Card body */
    .task-body { flex: 1; min-width: 0; }
    .task-name {
      font-size: .95rem;
      font-weight: 500;
      color: var(--ink);
      word-break: break-word;
      line-height: 1.4;
      transition: all var(--t);
    }
    .task-card.done .task-name {
      text-decoration: line-through;
      color: var(--ink3);
    }
    .task-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 5px;
    }
    .priority-badge {
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .p-low    .priority-badge { background: var(--p-low-bg);  color: var(--p-low); }
    .p-medium .priority-badge { background: var(--p-med-bg);  color: var(--p-med); }
    .p-high   .priority-badge { background: var(--p-high-bg); color: var(--p-high); }

    .due-date {
      font-size: .75rem;
      color: var(--ink3);
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .due-date.overdue { color: var(--red); font-weight: 600; }
    .due-date.soon    { color: var(--amber); font-weight: 500; }

    /* Edit input */
    .task-edit-input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--amber-border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: .92rem;
      color: var(--ink);
      outline: none;
      margin-bottom: 4px;
    }
    .task-edit-input:focus { box-shadow: 0 0 0 2px var(--amber-light); }

    /* Card actions */
    .task-actions {
      display: flex;
      gap: 4px;
      align-items: center;
      opacity: 0;
      transition: opacity var(--t);
    }
    .task-card:hover .task-actions { opacity: 1; }
    @media (hover: none) { .task-actions { opacity: 1; } }

    .task-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--ink3);
      display: grid; place-items: center;
      font-size: .85rem;
      transition: all var(--t);
    }
    .task-btn:hover.edit  { border-color: var(--amber); color: var(--amber); background: var(--amber-light); }
    .task-btn:hover.del   { border-color: var(--red);   color: var(--red);   background: var(--red-light); }
    .task-btn:hover.save  { border-color: var(--green); color: var(--green); background: var(--green-light); }

    /* ── Empty State ───────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--ink3);
    }
    .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .empty-state p { font-size: .9rem; }

    /* ── Completed section ─────────────────────────────────── */
    .completed-toggle {
      background: none;
      border: none;
      color: var(--ink3);
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      transition: color var(--t);
    }
    .completed-toggle:hover { color: var(--ink2); }
    .completed-toggle .chevron { transition: transform var(--t); }
    .completed-toggle.collapsed .chevron { transform: rotate(-90deg); }

    /* ── Clear completed ────────────────────────────────────── */
    .clear-btn {
      margin-left: auto;
      background: none;
      border: none;
      font-size: .72rem;
      color: var(--red);
      font-weight: 500;
      padding: 2px 0;
      transition: opacity var(--t);
    }
    .clear-btn:hover { opacity: .7; text-decoration: underline; }

    /* ── Responsive ────────────────────────────────────────── */
    @media (max-width: 500px) {
      .form-row1 { flex-direction: column; }
      .add-btn { padding: 12px; }
      .stats { gap: 8px; }
      .toolbar { gap: 8px; }
      .toolbar-right { margin-left: 0; width: 100%; }
      .sort-select { width: 100%; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- ── Header ─────────────────────────────────── -->
  <header class="header">
    <div class="header-left">
      <p class="brand">SkillCraft Technology</p>
      <h1 class="app-title">Task<em>Flow</em></h1>
      <p class="header-meta" id="header-date"></p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="theme-btn" title="Toggle dark/light mode">🌙</button>
    </div>
  </header>

  <!-- ── Stats ──────────────────────────────────── -->
  <div class="stats" id="stats-bar"></div>

  <!-- ── Add Task Form ──────────────────────────── -->
  <div class="add-form" role="form" aria-label="Add new task">
    <div class="form-row1">
      <input
        type="text"
        class="task-input"
        id="task-input"
        placeholder="What needs to be done?"
        maxlength="200"
        autocomplete="off"
        aria-label="Task name"
      />
      <button class="add-btn" id="add-btn" disabled aria-label="Add task">+ Add Task</button>
    </div>
    <div class="form-row2">
      <select id="priority-select" aria-label="Priority">
        <option value="low">🟢 Low Priority</option>
        <option value="medium" selected>🟡 Medium Priority</option>
        <option value="high">🔴 High Priority</option>
      </select>
      <input
        type="datetime-local"
        id="due-input"
        aria-label="Due date"
        title="Optional due date & time"
      />
    </div>
  </div>

  <!-- ── Filter + Sort toolbar ─────────────────── -->
  <div class="toolbar">
    <div class="filter-group" role="group" aria-label="Filter tasks">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Pending</button>
      <button class="filter-btn" data-filter="completed">Done</button>
    </div>
    <div class="toolbar-right">
      <select class="sort-select" id="sort-select" aria-label="Sort tasks">
        <option value="created">Sort: Added</option>
        <option value="due">Sort: Due Date</option>
        <option value="priority">Sort: Priority</option>
        <option value="alpha">Sort: A–Z</option>
      </select>
    </div>
  </div>

  <!-- ── Active Task List ───────────────────────── -->
  <div id="active-section">
    <p class="section-label" id="active-label">Pending</p>
    <div class="task-list" id="active-list"></div>
    <div id="active-empty" class="empty-state" style="display:none">
      <div class="empty-icon">✨</div>
      <p>No pending tasks — you're all caught up!</p>
    </div>
  </div>

  <!-- ── Completed Task List ────────────────────── -->
  <div id="completed-section" style="display:none">
    <p class="section-label" style="margin-top:32px">
      <button class="completed-toggle" id="completed-toggle">
        <span class="chevron">▾</span>
        <span id="completed-label">Completed</span>
      </button>
      <button class="clear-btn" id="clear-done-btn" title="Clear all completed tasks">Clear all</button>
    </p>
    <div id="completed-list-wrap">
      <div class="task-list" id="completed-list"></div>
    </div>
  </div>

</div><!-- /.page -->

<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->
<script>
/* ============================================================
   STATE & STORAGE
   Tasks are stored as an array in localStorage under 'tf_tasks'.
   Each task: { id, name, priority, due, done, created }
   ============================================================ */

const STORAGE_KEY = 'tf_tasks_v2';
const THEME_KEY   = 'tf_theme';

// Load from localStorage or start fresh
let tasks = loadTasks();
let filter = 'all';
let sort   = 'created';
let completedCollapsed = false;

/* ── Load / Save ─────────────────────────────────── */
function loadTasks() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e) { return []; }
}
function saveTasks() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}

/* ── Generate unique ID ──────────────────────────── */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

/* ============================================================
   TASK CRUD OPERATIONS
   ============================================================ */

/* ADD TASK — validates, creates object, appends, saves, renders */
function addTask(name, priority, due) {
  name = name.trim();
  if (!name) return;

  const task = {
    id:       uid(),
    name,
    priority: priority || 'medium',
    due:      due || '',          // ISO string or ''
    done:     false,
    created:  Date.now(),
  };

  tasks.unshift(task);            // newest first
  saveTasks();
  renderAll();
  animateAddBtn();
}

/* TOGGLE DONE — flips the done flag */
function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.done = !t.done;
  saveTasks();
  renderAll();
}

/* DELETE TASK — removes after animation */
function deleteTask(id) {
  const card = document.querySelector(`[data-id="${id}"]`);
  if (card) {
    card.classList.add('removing');
    setTimeout(() => {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderAll();
    }, 270);
  } else {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    renderAll();
  }
}

/* SAVE EDIT — updates name (and optionally priority/due) */
function saveEdit(id, newName) {
  newName = newName.trim();
  if (!newName) return;
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.name = newName;
  saveTasks();
  renderAll();
}

/* CLEAR COMPLETED */
function clearCompleted() {
  tasks = tasks.filter(t => !t.done);
  saveTasks();
  renderAll();
}

/* REORDER — drag-and-drop result */
function moveTask(fromId, toId) {
  const from = tasks.findIndex(t => t.id === fromId);
  const to   = tasks.findIndex(t => t.id === toId);
  if (from === -1 || to === -1 || from === to) return;
  const [item] = tasks.splice(from, 1);
  tasks.splice(to, 0, item);
  saveTasks();
  renderAll();
}

/* ============================================================
   SORTING & FILTERING
   ============================================================ */
const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };

function applySort(arr) {
  return [...arr].sort((a, b) => {
    if (sort === 'priority') return PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
    if (sort === 'due') {
      if (!a.due && !b.due) return 0;
      if (!a.due) return 1;
      if (!b.due) return -1;
      return new Date(a.due) - new Date(b.due);
    }
    if (sort === 'alpha') return a.name.localeCompare(b.name);
    return b.created - a.created; // default: newest first
  });
}

function getVisible() {
  let active    = applySort(tasks.filter(t => !t.done));
  let completed = applySort(tasks.filter(t =>  t.done));
  if (filter === 'active')    return { active, completed: [] };
  if (filter === 'completed') return { active: [], completed };
  return { active, completed };
}

/* ============================================================
   RENDER ENGINE
   Builds DOM from scratch on every state change.
   Efficient enough for task lists.
   ============================================================ */
function renderAll() {
  updateStats();
  const { active, completed } = getVisible();
  renderList('active-list', active, false);
  renderList('completed-list', completed, true);

  // Show/hide empty states
  document.getElementById('active-empty').style.display =
    active.length === 0 ? 'block' : 'none';

  // Completed section visibility
  const compSection = document.getElementById('completed-section');
  compSection.style.display = completed.length > 0 ? 'block' : 'none';

  // Completed section label count
  document.getElementById('completed-label').textContent =
    `Completed (${completed.length})`;

  // Active section label
  document.getElementById('active-label').textContent =
    `Pending (${active.length})`;

  // Collapse/expand completed list
  const wrap = document.getElementById('completed-list-wrap');
  wrap.style.display = completedCollapsed ? 'none' : 'block';
  document.getElementById('completed-toggle')
    .classList.toggle('collapsed', completedCollapsed);
}

/* Render a single list of tasks into a container */
function renderList(containerId, taskArr, isDone) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  taskArr.forEach((task, i) => {
    container.appendChild(buildCard(task, isDone, i));
  });
}

/* Build a task card DOM element */
function buildCard(task, isDone, index) {
  const card = document.createElement('div');
  card.className = `task-card p-${task.priority}${isDone ? ' done' : ''}`;
  card.setAttribute('data-id', task.id);
  card.setAttribute('draggable', 'true');
  card.setAttribute('role', 'listitem');
  card.style.animationDelay = `${index * 0.04}s`;

  /* ── Date status ── */
  let dateHTML = '';
  if (task.due) {
    const dueDate = new Date(task.due);
    const now     = new Date();
    const diffMs  = dueDate - now;
    const diffHrs = diffMs / 36e5;
    let cls = '', label = '';
    const opts = { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' };
    const fmtDate = dueDate.toLocaleString(undefined, opts);
    if (!task.done && diffMs < 0) {
      cls = 'overdue'; label = `⚠ Overdue · ${fmtDate}`;
    } else if (!task.done && diffHrs < 24) {
      cls = 'soon';    label = `⏰ Due soon · ${fmtDate}`;
    } else {
      label = `📅 ${fmtDate}`;
    }
    dateHTML = `<span class="due-date ${cls}">${label}</span>`;
  }

  /* ── Priority badge ── */
  const pLabel = { low:'Low', medium:'Medium', high:'High' }[task.priority];
  const priorityHTML = `<span class="priority-badge">${pLabel}</span>`;

  /* ── Inner HTML ── */
  card.innerHTML = `
    <input type="checkbox" class="task-check" ${isDone ? 'checked' : ''}
      aria-label="Mark task as ${isDone ? 'pending' : 'done'}" />
    <div class="task-body">
      <div class="task-name" id="name-${task.id}">${escapeHtml(task.name)}</div>
      <div class="task-meta">
        ${priorityHTML}
        ${dateHTML}
      </div>
    </div>
    <div class="task-actions">
      <button class="task-btn edit" title="Edit task" aria-label="Edit">✏️</button>
      <button class="task-btn del"  title="Delete task" aria-label="Delete">🗑</button>
    </div>
  `;

  /* ── Event listeners ── */
  card.querySelector('.task-check').addEventListener('change', () => toggleDone(task.id));
  card.querySelector('.task-btn.del').addEventListener('click',  () => deleteTask(task.id));
  card.querySelector('.task-btn.edit').addEventListener('click', () => startEdit(card, task));

  /* ── Drag and drop ── */
  setupDrag(card, task.id);

  return card;
}

/* ── Inline edit ─────────────────────────────────── */
function startEdit(card, task) {
  const nameEl = card.querySelector('.task-name');
  const actEl  = card.querySelector('.task-actions');

  // Replace name with input
  const input = document.createElement('input');
  input.className = 'task-edit-input';
  input.value = task.name;
  nameEl.replaceWith(input);
  input.focus();
  input.select();

  // Replace edit button with save button
  const editBtn = actEl.querySelector('.edit');
  editBtn.className = 'task-btn save';
  editBtn.textContent = '💾';
  editBtn.title = 'Save';

  function commit() {
    const newName = input.value.trim();
    if (newName && newName !== task.name) {
      saveEdit(task.id, newName);
    } else {
      renderAll(); // revert
    }
  }
  editBtn.onclick = commit;
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter')  commit();
    if (e.key === 'Escape') renderAll();
  });
  input.addEventListener('blur', () => {
    setTimeout(commit, 100); // allow save-btn click to fire first
  });
}

/* ============================================================
   DRAG AND DROP REORDERING
   ============================================================ */
let dragSrcId = null;

function setupDrag(card, id) {
  card.addEventListener('dragstart', e => {
    dragSrcId = id;
    setTimeout(() => card.classList.add('dragging'), 0);
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    document.querySelectorAll('.task-card').forEach(c => c.classList.remove('drag-over'));
  });
  card.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.task-card').forEach(c => c.classList.remove('drag-over'));
    if (id !== dragSrcId) card.classList.add('drag-over');
  });
  card.addEventListener('drop', e => {
    e.preventDefault();
    if (dragSrcId && dragSrcId !== id) {
      moveTask(dragSrcId, id);
    }
  });
}

/* ============================================================
   STATS BAR
   ============================================================ */
function updateStats() {
  const total    = tasks.length;
  const done     = tasks.filter(t => t.done).length;
  const overdue  = tasks.filter(t => !t.done && t.due && new Date(t.due) < new Date()).length;
  const pending  = total - done;

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-chip">
      <span class="num">${total}</span> Total
    </div>
    <div class="stat-chip">
      <span class="num">${pending}</span> Pending
    </div>
    <div class="stat-chip done">
      <span class="num">${done}</span> Done
    </div>
    ${overdue > 0 ? `<div class="stat-chip overdue"><span class="num">${overdue}</span> Overdue</div>` : ''}
  `;
}

/* ============================================================
   UTILITY HELPERS
   ============================================================ */
function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function animateAddBtn() {
  const btn = document.getElementById('add-btn');
  btn.textContent = '✓ Added!';
  setTimeout(() => { btn.textContent = '+ Add Task'; }, 1200);
}

/* ============================================================
   EVENT WIRING
   ============================================================ */

/* Add task button */
document.getElementById('add-btn').addEventListener('click', () => {
  const name     = document.getElementById('task-input').value;
  const priority = document.getElementById('priority-select').value;
  const due      = document.getElementById('due-input').value;
  if (!name.trim()) return;
  addTask(name, priority, due);
  document.getElementById('task-input').value = '';
  document.getElementById('due-input').value  = '';
  document.getElementById('priority-select').value = 'medium';
});

/* Enable/disable add button based on input */
document.getElementById('task-input').addEventListener('input', function() {
  document.getElementById('add-btn').disabled = !this.value.trim();
});

/* Enter key submits form */
document.getElementById('task-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && this.value.trim()) document.getElementById('add-btn').click();
});

/* Filter buttons */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    filter = this.dataset.filter;
    renderAll();
  });
});

/* Sort select */
document.getElementById('sort-select').addEventListener('change', function() {
  sort = this.value;
  renderAll();
});

/* Completed collapse toggle */
document.getElementById('completed-toggle').addEventListener('click', function() {
  completedCollapsed = !completedCollapsed;
  renderAll();
});

/* Clear completed button */
document.getElementById('clear-done-btn').addEventListener('click', () => {
  if (confirm('Remove all completed tasks?')) clearCompleted();
});

/* ── Dark / Light mode ───────────────────────────── */
function applyTheme(theme) {
  document.body.classList.toggle('dark', theme === 'dark');
  document.getElementById('theme-btn').textContent = theme === 'dark' ? '☀️' : '🌙';
}
let currentTheme = localStorage.getItem(THEME_KEY) || 'light';
applyTheme(currentTheme);
document.getElementById('theme-btn').addEventListener('click', () => {
  currentTheme = currentTheme === 'light' ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, currentTheme);
  applyTheme(currentTheme);
});

/* ── Header date ─────────────────────────────────── */
function updateHeaderDate() {
  const now = new Date();
  document.getElementById('header-date').textContent =
    now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}
updateHeaderDate();

/* ── Initial render ──────────────────────────────── */
renderAll();
</script>
